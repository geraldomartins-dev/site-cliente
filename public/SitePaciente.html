<body class="bg-white text-slate-800 selection:bg-teal-100 selection:text-teal-900">
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── CONFIGURAÇÃO ─────────────────────────────────────────────────────
    const API_BASE = window.location.protocol === 'file:'
        ? 'http://localhost:3001'
        : window.location.origin;

    // ─── HELPERS ──────────────────────────────────────────────────────────
    const dataMinima = () => {
        const h = new Date();
        h.setDate(h.getDate() + 1); // mínimo amanhã
        return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
    };

    const mascaraTelefone = v => {
        const n = v.replace(/\D/g,'').substring(0,11);
        if (n.length <= 2)  return n.length ? `(${n}` : '';
        if (n.length <= 6)  return `(${n.slice(0,2)}) ${n.slice(2)}`;
        if (n.length <= 10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
        return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
    };

    function useFadeUp() {
        const ref = useRef(null);
        useEffect(() => {
            const el = ref.current; if (!el) return;
            const obs = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
            }, { threshold: 0.12 });
            el.querySelectorAll('.fade-up').forEach(n => obs.observe(n));
            return () => obs.disconnect();
        }, []);
        return ref;
    }

    // ─── GRADE DE HORÁRIOS ─────────────────────────────────────────────────
    function GradeHorarios({ data, horarioSelecionado, onSelect }) {
        const [disponiveis, setDisponiveis] = useState([]);
        const [carregando,  setCarregando]  = useState(false);
        const [erro, setErro] = useState(false);
        const [tentativa, setTentativa] = useState(0);
        const todos = ['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];

        useEffect(() => {
            if (!data) { setDisponiveis([]); return; }
            setCarregando(true);
            setErro(false);
            onSelect(''); // reseta seleção ao mudar data
            fetch(`${API_BASE}/api/horarios-disponiveis?data=${data}`)
                .then(r => {
                    if (!r.ok) throw new Error('Não foi possível consultar a agenda.');
                    return r.json();
                })
                .then(d => { setDisponiveis(d.disponiveis || []); })
                .catch(() => { setDisponiveis([]); setErro(true); })
                .finally(() => setCarregando(false));
        }, [data, tentativa]);

        if (!data) return (
            <p className="text-slate-400 text-sm text-center py-4">
                <i className="fa-regular fa-calendar mr-2"></i>Selecione uma data primeiro
            </p>
        );

        const manha = todos.filter(h => parseInt(h) < 12);
        const tarde = todos.filter(h => parseInt(h) >= 12);

        const Slot = ({ h }) => {
            const livre = disponiveis.includes(h);
            const sel   = horarioSelecionado === h;
            return (
                <button
                    type="button"
                    disabled={!livre || carregando}
                    onClick={() => livre && onSelect(h)}
                    className={`horario-btn ${sel ? 'selected' : ''} ${carregando ? 'carregando' : ''}`}
                    title={livre ? `Selecionar ${h}` : 'Horário ocupado'}
                >
                    {carregando ? <i className="fa-solid fa-circle-notch fa-spin text-xs"></i> : h}
                    {!carregando && !livre && <span className="block text-[10px] font-normal mt-0.5 opacity-70">Ocupado</span>}
                </button>
            );
        };

        return (
            <div>
                <div className="mb-3">
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i className="fa-solid fa-sun text-amber-400"></i> Manhã
                    </p>
                    <div className="grid grid-cols-4 gap-2">
                        {manha.map(h => <Slot key={h} h={h} />)}
                    </div>
                </div>
                <div>
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i className="fa-solid fa-moon text-indigo-400"></i> Tarde
                    </p>
                    <div className="grid grid-cols-5 gap-2">
                        {tarde.map(h => <Slot key={h} h={h} />)}
                    </div>
                </div>
                {!carregando && erro && (
                    <div className="text-center text-sm text-amber-700 mt-3 bg-amber-50 p-3 rounded-xl border border-amber-200" role="alert">
                        <p className="font-semibold"><i className="fa-solid fa-wifi mr-1"></i> Não conseguimos consultar a agenda agora.</p>
                        <button type="button" onClick={() => setTentativa(t => t + 1)} className="mt-2 text-xs font-bold underline hover:text-amber-900">Tentar novamente</button>
                    </div>
                )}
                {!carregando && !erro && disponiveis.length === 0 && (
                    <p className="text-center text-sm text-red-500 font-semibold mt-3 bg-red-50 py-2 rounded-xl border border-red-100">
                        <i className="fa-solid fa-calendar-xmark mr-1"></i> Nenhum horário disponível nesta data.
                    </p>
                )}
                {!carregando && !erro && disponiveis.length > 0 && (
                    <p className="text-xs text-slate-400 text-center mt-2">
                        {disponiveis.length} horário(s) disponível(eis)
                    </p>
                )}
            </div>
        );
    }

    // ─── FORMULÁRIO ────────────────────────────────────────────────────────
    function FormAgendamento() {
        const [formData, setFormData] = useState({
            nome:'', telefone:'', data:'', horario:'', preferencia:'', observacoes:''
        });
        const [estado, setEstado] = useState({ loading:false, enviado:false, erro:null });
        const [aceitouPrivacidade, setAceitouPrivacidade] = useState(false);
        const [resumoPedido, setResumoPedido] = useState(null);

        const handleChange = e => {
            const { name, value } = e.target;
            if (name === 'data' && value) {
                const diaSemana = new Date(`${value}T12:00:00`).getDay();
                if (diaSemana === 0 || diaSemana === 6) {
                    setEstado({ loading:false, enviado:false, erro:'Atendemos de segunda a sexta. Escolha um dia útil.' });
                    setFormData(prev => ({ ...prev, data:'', horario:'' }));
                    return;
                }
            }
            if (estado.erro) setEstado(prev => ({ ...prev, erro:null }));
            setFormData(prev => ({ ...prev, [name]: name === 'telefone' ? mascaraTelefone(value) : value }));
        };

        const setHorario = h => setFormData(prev => ({ ...prev, horario: h }));

        const handleSubmit = async e => {
            e.preventDefault();
            if (!formData.horario) {
                setEstado({ loading:false, enviado:false, erro:'Selecione um horário disponível.' });
                setTimeout(() => setEstado(p => ({ ...p, erro:null })), 5000);
                return;
            }
            const tel = formData.telefone.replace(/\D/g,'');
            if (tel.length < 10) {
                setEstado({ loading:false, enviado:false, erro:'Informe um celular válido com DDD.' });
                setTimeout(() => setEstado(p => ({ ...p, erro:null })), 5000);
                return;
            }
            if (!aceitouPrivacidade) {
                setEstado({ loading:false, enviado:false, erro:'Confirme o uso dos dados para solicitar o agendamento.' });
                return;
            }
            setEstado({ loading:true, enviado:false, erro:null });
            try {
                const res = await fetch(`${API_BASE}/api/agendamentos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formData, telefone: tel })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.erro || 'Erro ao enviar.');
                setResumoPedido({ data:formData.data, horario:formData.horario });
                setEstado({ loading:false, enviado:true, erro:null });
                setAceitouPrivacidade(false);
                setFormData({ nome:'', telefone:'', data:'', horario:'', preferencia:'', observacoes:'' });
            } catch (err) {
                setEstado({ loading:false, enviado:false, erro: err.message });
                setTimeout(() => setEstado(p => ({ ...p, erro:null })), 7000);
            }
        };

        const fieldClass = "w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-teal-500 transition bg-slate-50 focus:bg-white font-medium text-sm text-slate-800 placeholder:text-slate-400 outline-none";

        if (estado.enviado) return (
            <div className="flex flex-col items-center justify-center text-center py-14 space-y-5">
                <div className="w-20 h-20 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center text-4xl badge-pulse">
                    <i className="fa-solid fa-check"></i>
                </div>
                <h3 className="text-2xl font-bold text-slate-900">Solicitação recebida!</h3>
                <p className="text-slate-500 max-w-xs leading-relaxed text-sm">
                    Reservamos sua solicitação para {resumoPedido?.data ? new Date(`${resumoPedido.data}T12:00:00`).toLocaleDateString('pt-BR') : 'a data escolhida'}, às {resumoPedido?.horario}. A consulta fica confirmada após nosso retorno pelo WhatsApp.
                </p>
                <a href="https://wa.me/554396941226" target="_blank" rel="noopener noreferrer"
                   className="inline-flex items-center gap-2 bg-green-500 text-white font-bold px-6 py-3 rounded-full hover:bg-green-600 transition shadow-md">
                    <i className="fa-brands fa-whatsapp text-lg"></i> Conversar no WhatsApp
                </a>
                <button onClick={() => setEstado({ loading:false, enviado:false, erro:null })}
                    className="text-xs text-slate-400 hover:text-teal-600 transition underline">
                    Fazer outro agendamento
                </button>
            </div>
        );

        return (
            <form onSubmit={handleSubmit} className="space-y-4" noValidate>
                <div className="mb-5">
                    <p className="text-xs font-bold uppercase tracking-widest text-teal-600 mb-1">Leva menos de 2 minutos</p>
                    <h3 className="text-xl font-bold text-slate-900">Solicite seu horário</h3>
                    <p className="text-xs text-slate-500 mt-1">Você receberá a confirmação pelo WhatsApp.</p>
                </div>

                {estado.erro && (
                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm flex items-center gap-2">
                        <i className="fa-solid fa-circle-exclamation flex-shrink-0"></i>
                        {estado.erro}
                    </div>
                )}

                {/* Nome */}
                <div>
                    <label htmlFor="nome" className="block text-sm font-semibold text-slate-700 mb-1.5">
                        Nome completo <span className="text-red-400">*</span>
                    </label>
                    <input id="nome" autoComplete="name" required type="text" name="nome" value={formData.nome} onChange={handleChange}
                        maxLength={150} placeholder="Como prefere ser chamado?"
                        className={fieldClass} />
                </div>

                {/* Telefone */}
                <div>
                    <label htmlFor="telefone" className="block text-sm font-semibold text-slate-700 mb-1.5">
                        Celular / WhatsApp <span className="text-red-400">*</span>
                    </label>
                    <input id="telefone" autoComplete="tel" required type="tel" name="telefone" value={formData.telefone} onChange={handleChange}
                        placeholder="(43) 9 9999-0000" inputMode="numeric"
                        className={fieldClass} />
                </div>

                {/* Motivo */}
                <div>
                    <label htmlFor="preferencia" className="block text-sm font-semibold text-slate-700 mb-1.5">
                        Motivo da consulta <span className="text-red-400">*</span>
                    </label>
                    <select id="preferencia" required name="preferencia" value={formData.preferencia} onChange={handleChange}
                        className={fieldClass}>
                        <option value="">Qual o motivo principal?</option>
                        <option value="limpeza">🦷 Check-up / Limpeza</option>
                        <option value="dor">🚨 Urgência / Dor</option>
                        <option value="estetica">✨ Estética Dental</option>
                        <option value="implante">🔩 Implante Dentário</option>
                        <option value="orcamento">📋 Orçamento de Tratamento</option>
                        <option value="outro">💬 Outro Motivo</option>
                    </select>
                </div>

                {/* Data */}
                <div>
                    <label htmlFor="data" className="block text-sm font-semibold text-slate-700 mb-1.5">
                        Data desejada <span className="text-red-400">*</span>
                    </label>
                    <input id="data" required type="date" name="data" value={formData.data} onChange={handleChange}
                        min={dataMinima()}
                        className={fieldClass} />
                </div>

                {/* Grade de horários */}
                <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">
                        Horário disponível <span className="text-red-400">*</span>
                    </label>
                    <div className="bg-slate-50 border-2 border-slate-200 rounded-xl p-4">
                        <GradeHorarios
                            data={formData.data}
                            horarioSelecionado={formData.horario}
                            onSelect={setHorario}
                        />
                    </div>
                    {formData.horario && (
                        <p className="text-teal-600 text-xs font-bold mt-1.5 flex items-center gap-1.5">
                            <i className="fa-solid fa-check-circle"></i>
                            Horário selecionado: {formData.horario}
                        </p>
                    )}
                </div>

                {/* Observações */}
                <div>
                    <label htmlFor="observacoes" className="block text-sm font-semibold text-slate-700 mb-1.5">
                        Observações <span className="text-slate-400 font-normal text-xs">(opcional)</span>
                    </label>
                    <textarea id="observacoes" name="observacoes" value={formData.observacoes} onChange={handleChange}
                        rows="2" maxLength={1000} placeholder="Alguma informação adicional?"
                        className={`${fieldClass} resize-none`}>
                    </textarea>
                </div>

                <label className="flex items-start gap-3 p-3 rounded-xl bg-teal-50 border border-teal-100 cursor-pointer">
                    <input type="checkbox" checked={aceitouPrivacidade} onChange={e => setAceitouPrivacidade(e.target.checked)} className="mt-0.5 w-4 h-4 accent-teal-600" />
                    <span className="text-xs text-slate-600 leading-relaxed">Autorizo o uso destes dados exclusivamente para contato e organização do atendimento.</span>
                </label>

                <button disabled={estado.loading || !formData.horario || !aceitouPrivacidade} type="submit"
                    className="w-full bg-teal-600 text-white font-bold py-4 rounded-xl hover:bg-teal-700 active:bg-teal-800 transition shadow-lg disabled:opacity-60 disabled:cursor-not-allowed flex justify-center items-center gap-2 text-base mt-2">
                    {estado.loading
                        ? <><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full loader"></div> Enviando...</>
                        : <><i className="fa-solid fa-paper-plane"></i> Solicitar este horário</>
                    }
                </button>
                <p className="text-center text-xs text-slate-400 pt-1">
                    <i className="fa-solid fa-shield-halved text-teal-400 mr-1"></i>
                    Seus dados são usados apenas para organizar o atendimento.
                </p>
            </form>
        );
    }

    // ─── ILUSTRAÇÃO SVG ────────────────────────────────────────────────────

    }

    // ─── HEADER ────────────────────────────────────────────────────────────
    function Header() {
        const [mobileOpen, setMobileOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);
        useEffect(() => {
            const fn = () => setScrolled(window.scrollY > 20);
            window.addEventListener('scroll', fn, { passive:true });
            return () => window.removeEventListener('scroll', fn);
