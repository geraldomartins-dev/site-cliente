<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <meta name="robots" content="noindex,nofollow">
    <title>Painel da clínica — Dra. Natyla Picoloto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .loader { border-top-color: transparent; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        * { box-sizing: border-box; }
        :focus-visible { outline: 3px solid #5eead4; outline-offset: 2px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden">
<div id="root" class="h-full"></div>
<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ─── CONFIG ──────────────────────────────────────────────────────────────
    // Em HTTP usa sempre a mesma origem/porta do site. Ao abrir o HTML diretamente,
    // aponta para a porta local alternativa usada no desenvolvimento.
    const API_BASE = window.location.protocol === 'file:'
        ? 'http://localhost:3001'
        : window.location.origin;
    const API = `${API_BASE}/api`;

    // Preços padrão para pré-preencher o modal (editável aqui)
    // Estes são apenas um ponto de partida — o valor final é sempre confirmado pela dentista
    const PRECOS_PADRAO = {
        limpeza:   150,
        dor:       200,
        estetica:  350,
        implante:  800,
        orcamento:   0,
        outro:     150,
    };

    // ─── HELPERS ─────────────────────────────────────────────────────────────
    const isoParaDia = s => s ? String(s).split('T')[0] : '';

    const formatarData = s => {
        const d = isoParaDia(s);
        if (!d) return '';
        const [a, m, dd] = d.split('-');
        return `${dd}/${m}/${a}`;
    };

    const formatarReais = v => {
        const n = parseFloat(v) || 0;
        return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const mesAtualStr = () => {
        const h = new Date();
        return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}`;
    };

    const hojeStr = () => {
        const h = new Date();
        return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
    };

    // Formata horário: '08:00' fica '08:00', 'manha' fica 'Manhã' (legado)
    const formatarHorario = h => {
        if (!h) return '';
        if (h.includes(':')) return h;
        return h === 'manha' ? '☀️ Manhã' : '🌙 Tarde';
    };

    // ─── AUTENTICAÇÃO ────────────────────────────────────────────────────────
    function AuthScreen({ modo, setModo, resetToken, cadastroDisponivel, onAutenticado }) {
        const [form, setForm] = useState({ nome:'', email:'', senha:'', confirmar:'', codigo:'' });
        const [estadoAuth, setEstadoAuth] = useState({ loading:false, erro:null, mensagem:null, link:null });
        const [mostrarSenha, setMostrarSenha] = useState(false);

        const atualizar = e => setForm(p => ({ ...p, [e.target.name]: e.target.value }));
        const mudarModo = novo => {
            setEstadoAuth({ loading:false, erro:null, mensagem:null, link:null });
            setForm(p => ({ ...p, senha:'', confirmar:'', codigo:'' }));
            setModo(novo);
        };

        const enviar = async e => {
            e.preventDefault();
            if ((modo === 'cadastro' || modo === 'reset') && form.senha !== form.confirmar) {
                setEstadoAuth(p => ({ ...p, erro:'As senhas não coincidem.' }));
                return;
            }
            const configs = {
                login: { rota:'/auth/login', body:{ email:form.email, senha:form.senha } },
                cadastro: { rota:'/auth/cadastro', body:{ nome:form.nome, email:form.email, senha:form.senha, codigo:form.codigo } },
                esqueci: { rota:'/auth/esqueci-senha', body:{ email:form.email } },
                reset: { rota:'/auth/redefinir-senha', body:{ token:resetToken, senha:form.senha } },
            };
            const config = configs[modo];
            if (!config) return;
            setEstadoAuth({ loading:true, erro:null, mensagem:null, link:null });
            try {
                const r = await fetch(`${API}${config.rota}`, {
                    method:'POST',
                    headers:{ 'Content-Type':'application/json' },
                    credentials:'same-origin',
                    body:JSON.stringify(config.body),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.erro || 'Não foi possível continuar.');
                if (modo === 'login' || modo === 'cadastro') return onAutenticado(d.usuario);
                if (modo === 'esqueci') {
                    setEstadoAuth({ loading:false, erro:null, mensagem:d.mensagem, link:d.linkDesenvolvimento || null });
                    setModo('email-enviado');
                    return;
                }
                if (modo === 'reset') {
                    history.replaceState({}, '', '/painel');
                    setEstadoAuth({ loading:false, erro:null, mensagem:d.mensagem, link:null });
                    setModo('senha-alterada');
                }
            } catch (err) {
                setEstadoAuth({ loading:false, erro:err.message === 'Failed to fetch' ? 'Servidor indisponível. Confirme se ele está iniciado.' : err.message, mensagem:null, link:null });
            }
        };

        const inputClass = 'w-full h-12 px-4 border-2 border-slate-200 rounded-xl focus:border-teal-500 outline-none bg-slate-50 focus:bg-white text-sm transition';
        const titulos = {
            login:['Bem-vinda de volta','Entre com seu e-mail e sua senha.'],
            cadastro:['Criar primeira conta','Esta será a conta administradora da clínica.'],
            esqueci:['Recuperar acesso','Enviaremos um link para criar uma nova senha.'],
            reset:['Criar nova senha','Escolha uma senha segura para o painel.'],
            'email-enviado':['Confira seu e-mail','Se o endereço estiver cadastrado, as instruções chegarão em instantes.'],
            'senha-alterada':['Senha atualizada','Seu acesso está protegido com a nova senha.'],
        };
        const [titulo, subtitulo] = titulos[modo] || titulos.login;

        return (
            <div className="h-[100dvh] overflow-y-auto bg-gradient-to-br from-slate-100 via-white to-teal-50 px-4 py-6 sm:p-6 flex items-start sm:items-center justify-center">
                <div className="bg-white p-6 sm:p-9 rounded-3xl shadow-2xl max-w-md w-full border border-slate-100 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-teal-400 to-teal-600"></div>
                    <div className="text-center mb-7">
                        <div className="bg-teal-50 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl text-teal-600 border border-teal-100">
                            <i className={`fa-solid ${modo === 'senha-alterada' ? 'fa-check' : modo === 'email-enviado' ? 'fa-envelope-circle-check' : 'fa-shield-halved'}`}></i>
                        </div>
                        <p className="text-[10px] text-teal-600 font-bold tracking-[.2em] uppercase mb-2">Painel da clínica</p>
                        <h1 className="text-xl font-extrabold text-slate-900">{titulo}</h1>
                        <p className="text-slate-500 text-sm mt-1.5">{subtitulo}</p>
                    </div>

                    {(modo === 'email-enviado' || modo === 'senha-alterada') ? (
                        <div className="space-y-4 text-center">
                            {estadoAuth.mensagem && <p className="text-sm text-slate-600 bg-slate-50 p-4 rounded-xl">{estadoAuth.mensagem}</p>}
                            {estadoAuth.link && (
                                <a href={estadoAuth.link} className="block bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs font-bold break-words">
                                    Abrir link local de recuperação
                                </a>
                            )}
                            <button onClick={() => mudarModo('login')} className="w-full h-12 bg-slate-900 text-white font-bold rounded-xl hover:bg-teal-700 transition">Voltar para o login</button>
                        </div>
                    ) : (
                        <form onSubmit={enviar} className="space-y-4">
                            {modo === 'cadastro' && (
                                <div>
                                    <label htmlFor="auth-nome" className="block text-xs font-bold text-slate-600 mb-1.5">Nome completo</label>
                                    <input id="auth-nome" name="nome" value={form.nome} onChange={atualizar} className={inputClass} autoComplete="name" required autoFocus />
                                </div>
                            )}
                            {modo !== 'reset' && (
                                <div>
                                    <label htmlFor="auth-email" className="block text-xs font-bold text-slate-600 mb-1.5">E-mail</label>
                                    <input id="auth-email" name="email" type="email" value={form.email} onChange={atualizar} className={inputClass} autoComplete="email" required autoFocus={modo !== 'cadastro'} placeholder="voce@exemplo.com" />
                                </div>
                            )}
                            {(modo === 'login' || modo === 'cadastro' || modo === 'reset') && (
                                <div>
                                    <label htmlFor="auth-senha" className="block text-xs font-bold text-slate-600 mb-1.5">Senha</label>
                                    <div className="relative">
                                        <input id="auth-senha" name="senha" type={mostrarSenha ? 'text' : 'password'} value={form.senha} onChange={atualizar} className={`${inputClass} pr-12`} autoComplete={modo === 'login' ? 'current-password' : 'new-password'} required minLength="8" />
                                        <button type="button" onClick={() => setMostrarSenha(v => !v)} aria-label={mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'} className="absolute right-1.5 top-1.5 w-9 h-9 text-slate-400 hover:text-teal-600 rounded-lg">
                                            <i className={`fa-regular ${mostrarSenha ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                    {modo !== 'login' && <p className="text-[11px] text-slate-400 mt-1">Mínimo de 8 caracteres, com letra e número.</p>}
                                </div>
                            )}
                            {(modo === 'cadastro' || modo === 'reset') && (
                                <div>
                                    <label htmlFor="auth-confirmar" className="block text-xs font-bold text-slate-600 mb-1.5">Confirmar senha</label>
                                    <input id="auth-confirmar" name="confirmar" type={mostrarSenha ? 'text' : 'password'} value={form.confirmar} onChange={atualizar} className={inputClass} autoComplete="new-password" required minLength="8" />
                                </div>
                            )}
                            {modo === 'cadastro' && (
                                <div>
                                    <label htmlFor="auth-codigo" className="block text-xs font-bold text-slate-600 mb-1.5">Código de configuração</label>
                                    <input id="auth-codigo" name="codigo" type="password" value={form.codigo} onChange={atualizar} className={inputClass} required />
                                    <p className="text-[11px] text-slate-400 mt-1">Use o SETUP_TOKEN configurado no arquivo .env.</p>
                                </div>
                            )}
                            {estadoAuth.erro && <p role="alert" className="text-red-700 bg-red-50 border border-red-200 p-3 rounded-xl text-xs font-semibold">{estadoAuth.erro}</p>}
                            <button disabled={estadoAuth.loading} type="submit" className="w-full h-12 bg-slate-900 text-white font-bold rounded-xl hover:bg-teal-700 transition flex justify-center items-center gap-2 disabled:opacity-60">
                                {estadoAuth.loading ? <><span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full loader"></span> Aguarde...</> : modo === 'login' ? 'Entrar com segurança' : modo === 'cadastro' ? 'Criar conta e entrar' : modo === 'esqueci' ? 'Enviar instruções' : 'Salvar nova senha'}
                            </button>
                            {modo === 'login' && (
                                <div className="flex items-center justify-between gap-4 pt-1 text-xs font-bold">
                                    <button type="button" onClick={() => mudarModo('esqueci')} className="text-slate-500 hover:text-teal-600">Esqueci minha senha</button>
                                    {cadastroDisponivel && <button type="button" onClick={() => mudarModo('cadastro')} className="text-teal-600 hover:text-teal-800">Criar primeira conta</button>}
                                </div>
                            )}
                            {(modo === 'cadastro' || modo === 'esqueci') && <button type="button" onClick={() => mudarModo('login')} className="w-full text-xs font-bold text-slate-400 hover:text-teal-600">Voltar para o login</button>}
                        </form>
                    )}
                    <p className="text-center text-[10px] text-slate-400 mt-7"><i className="fa-solid fa-lock mr-1"></i>Sessão protegida e encerrada automaticamente.</p>
                </div>
            </div>
        );
    }

    // ─── MODAL FINANCEIRO ────────────────────────────────────────────────────
    function ModalFinanceiro({ item, onSalvar, onFechar }) {
        const valorInicial = item.valor != null
            ? String(item.valor)
            : String(PRECOS_PADRAO[item.preferencia] ?? 0);

        const [valor,   setValor]   = useState(valorInicial);
        const [pago,    setPago]    = useState(!!item.pago);
        const [loading, setLoading] = useState(false);
        const [erro,    setErro]    = useState(null);

        const salvar = async () => {
            const v = parseFloat(valor);
            if (isNaN(v) || v < 0) { setErro('Informe um valor válido.'); return; }
            setLoading(true); setErro(null);
            try {
                const r = await fetch(`${API}/agendamentos/${item.id}/financeiro`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ valor: v, pago })
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) { setErro(data.erro || 'Erro ao salvar.'); return; }
                onSalvar(item.id, v, pago);
                onFechar();
            } catch { setErro('Erro de rede. Verifique o servidor.'); }
            finally { setLoading(false); }
        };

        return (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={onFechar}>
                <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-start mb-1">
                        <h3 className="text-lg font-extrabold text-slate-900">Registrar Pagamento</h3>
                        <button onClick={onFechar} className="text-slate-400 hover:text-slate-600 text-xl leading-none"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    <p className="text-slate-500 text-sm mb-1">{item.nome}</p>
                    <p className="text-slate-400 text-xs mb-6">{formatarData(item.data)} · {item.preferencia || 'Avaliação geral'}</p>

                    {erro && (
                        <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-2 rounded-xl text-sm mb-4 flex items-center gap-2">
                            <i className="fa-solid fa-triangle-exclamation flex-shrink-0"></i> {erro}
                        </div>
                    )}

                    <div className="space-y-4">
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">Valor cobrado (R$)</label>
                            <input type="number" min="0" step="0.01" value={valor}
                                onChange={e => setValor(e.target.value)}
                                className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-teal-500 outline-none text-xl font-mono text-center" />
                        </div>

                        <div className="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer" onClick={() => setPago(!pago)}>
                            <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all ${pago ? 'bg-teal-500 border-teal-500' : 'border-slate-300'}`}>
                                {pago && <i className="fa-solid fa-check text-white text-xs"></i>}
                            </div>
                            <span className="font-semibold text-slate-700 text-sm select-none">Marcar como pago</span>
                        </div>

                        <div className="flex gap-3 pt-2">
                            <button onClick={onFechar}
                                className="flex-1 border border-slate-200 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-50 transition text-sm">
                                Cancelar
                            </button>
                            <button onClick={salvar} disabled={loading}
                                className="flex-1 bg-teal-600 text-white font-bold py-3 rounded-xl hover:bg-teal-700 transition text-sm flex items-center justify-center gap-2">
                                {loading ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full loader"></div> : 'Salvar'}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ─── APP ─────────────────────────────────────────────────────────────────
    function App() {
        const resetToken = new URLSearchParams(window.location.search).get('reset');
        const [token,        setToken]        = useState(false);
        const [usuario,      setUsuario]      = useState(null);
        const [authMode,     setAuthMode]     = useState(resetToken ? 'reset' : 'login');
        const [cadastroDisponivel, setCadastroDisponivel] = useState(false);
        const [estado,       setEstado]       = useState({ loading: false, erro: null, validando: true });
        const [agendamentos, setAgendamentos] = useState([]);
        const [clientes,     setClientes]     = useState([]);
        const [usuarios,     setUsuarios]     = useState([]);
        const [telaAtiva,    setTelaAtiva]    = useState('inicio');
        const [mesAtual,     setMesAtual]     = useState(new Date());
        const [dataSel,      setDataSel]      = useState(hojeStr);
        const [termoBusca,   setTermoBusca]   = useState('');
        const [pacienteSel,  setPacienteSel]  = useState(null);
        const [resumoFin,    setResumoFin]    = useState(null);
        const [mesFin,       setMesFin]       = useState(mesAtualStr());
        const [modalFin,     setModalFin]     = useState(null);
        const [finLoading,   setFinLoading]   = useState(false);
        const [sidebarOpen,  setSidebarOpen]  = useState(false);
        const [conexao,      setConexao]      = useState('conectando');
        const [novoUsuario,  setNovoUsuario]  = useState({ nome:'', email:'', senha:'', papel:'dentista' });
        const [equipeEstado, setEquipeEstado] = useState({ loading:false, erro:null, sucesso:null });
        const [novoCliente,  setNovoCliente]  = useState({ nome:'', telefone:'', email:'' });
        const [clienteEstado,setClienteEstado]= useState({ aberto:false, loading:false, erro:null });
        const pollingRef = useRef(null);

        useEffect(() => {
            let ativo = true;
            const iniciarAuth = async () => {
                try {
                    const [statusR, meR] = await Promise.all([
                        fetch(`${API}/auth/status`, { credentials:'same-origin' }),
                        fetch(`${API}/auth/me`, { credentials:'same-origin' }),
                    ]);
                    const status = await statusR.json().catch(() => ({}));
                    if (!ativo) return;
                    setCadastroDisponivel(!!status.cadastroDisponivel);
                    if (meR.ok && !resetToken) {
                        const dados = await meR.json();
                        setUsuario(dados.usuario);
                        setToken(true);
                    } else if (!resetToken) {
                        setAuthMode(status.cadastroDisponivel ? 'cadastro' : 'login');
                    } else {
                        setAuthMode('reset');
                    }
                } catch {
                    if (ativo) setEstado(p => ({ ...p, erro:'Servidor indisponível.' }));
                } finally {
                    if (ativo) setEstado(p => ({ ...p, validando:false }));
                }
            };
            iniciarAuth();
            return () => { ativo = false; };
        }, []);

        const aoAutenticar = novoUsuario => {
            setUsuario(novoUsuario);
            setToken(true);
            setCadastroDisponivel(false);
            setEstado({ loading:false, erro:null, validando:false });
        };

        // ── Busca agendamentos
        const buscarDados = useCallback(async () => {
            if (!token) return;
            try {
                const [r, clientesR] = await Promise.all([
                    fetch(`${API}/agendamentos`, { credentials:'same-origin' }),
                    fetch(`${API}/clientes`, { credentials:'same-origin' }),
                ]);
                if (r.ok && clientesR.ok) {
                    setAgendamentos(await r.json());
                    setClientes(await clientesR.json());
                    setConexao('online');
                }
                else if (r.status === 401 || clientesR.status === 401) {
                    setToken(false); setUsuario(null); setAuthMode('login');
                }
                else setConexao('offline');
            } catch { setConexao('offline'); }
            finally { setEstado(p => ({ ...p, validando: false })); }
        }, [token]);

        // ── Busca resumo financeiro
        const buscarFinanceiro = useCallback(async (mes) => {
            if (!token) return;
            setFinLoading(true);
            try {
                const r = await fetch(`${API}/financeiro/resumo?mes=${mes}`, { credentials:'same-origin' });
                if (r.ok) setResumoFin(await r.json());
                else setResumoFin(null);
            } catch { setResumoFin(null); }
            finally { setFinLoading(false); }
        }, [token]);

        useEffect(() => {
            if (!token) return;
            buscarDados();
            pollingRef.current = setInterval(buscarDados, 20000);
            return () => clearInterval(pollingRef.current);
        }, [buscarDados]);

        useEffect(() => {
            if (token && telaAtiva === 'financeiro') buscarFinanceiro(mesFin);
        }, [token, telaAtiva, mesFin, buscarFinanceiro]);

        const buscarUsuarios = useCallback(async () => {
            if (!token || usuario?.papel !== 'admin') return;
            try {
                const r = await fetch(`${API}/usuarios`, { credentials:'same-origin' });
                if (r.ok) setUsuarios(await r.json());
            } catch {}
        }, [token, usuario]);

        useEffect(() => {
            if (telaAtiva === 'equipe') buscarUsuarios();
        }, [telaAtiva, buscarUsuarios]);

        useEffect(() => { setTermoBusca(''); }, [telaAtiva]);

        const criarUsuario = async e => {
            e.preventDefault();
            setEquipeEstado({ loading:true, erro:null, sucesso:null });
            try {
                const r = await fetch(`${API}/usuarios`, {
                    method:'POST', headers:{ 'Content-Type':'application/json' }, credentials:'same-origin',
                    body:JSON.stringify(novoUsuario),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.erro || 'Não foi possível criar o usuário.');
                setNovoUsuario({ nome:'', email:'', senha:'', papel:'dentista' });
                setEquipeEstado({ loading:false, erro:null, sucesso:'Acesso criado com sucesso.' });
                buscarUsuarios();
            } catch (err) { setEquipeEstado({ loading:false, erro:err.message, sucesso:null }); }
        };

        const alterarUsuario = async (id, ativo) => {
            try {
                const r = await fetch(`${API}/usuarios/${id}/status`, {
                    method:'PATCH', headers:{ 'Content-Type':'application/json' }, credentials:'same-origin',
                    body:JSON.stringify({ ativo }),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.erro || 'Não foi possível alterar o usuário.');
                buscarUsuarios();
            } catch (err) { setEquipeEstado({ loading:false, erro:err.message, sucesso:null }); }
        };

        const criarCliente = async e => {
            e.preventDefault();
            setClienteEstado(p => ({ ...p, loading:true, erro:null }));
            try {
                const r = await fetch(`${API}/clientes`, {
                    method:'POST', headers:{ 'Content-Type':'application/json' }, credentials:'same-origin',
                    body:JSON.stringify(novoCliente),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.erro || 'Não foi possível cadastrar o paciente.');
                setNovoCliente({ nome:'', telefone:'', email:'' });
                setClienteEstado({ aberto:false, loading:false, erro:null });
                buscarDados();
            } catch (err) { setClienteEstado(p => ({ ...p, loading:false, erro:err.message })); }
        };

        const sair = async () => {
            clearInterval(pollingRef.current);
            try { await fetch(`${API}/auth/logout`, { method:'POST', credentials:'same-origin' }); } catch {}
            setToken(null);
            setUsuario(null);
            setAgendamentos([]);
            setClientes([]);
            setConexao('conectando');
            setAuthMode('login');
            setEstado({ loading: false, erro: null, validando: false });
        };

        // ── Apagar agendamento
        const apagar = async id => {
            if (!confirm('Apagar este agendamento do sistema?')) return;
            try {
                const r = await fetch(`${API}/agendamentos/${id}`, { method: 'DELETE', credentials:'same-origin' });
                if (r.ok || r.status === 204) {
                    setAgendamentos(p => p.filter(a => a.id !== id));
                } else {
                    alert('Erro ao apagar agendamento.');
                }
            } catch { setConexao('offline'); alert('Sem conexão. O agendamento não foi apagado.'); }
        };

        // ── Atualizar status (otimista)
        const atualizarStatus = async (id, novoStatus) => {
            setAgendamentos(p => p.map(a => a.id === id ? { ...a, status: novoStatus } : a));
            try {
                const r = await fetch(`${API}/agendamentos/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials:'same-origin',
                    body: JSON.stringify({ status: novoStatus })
                });
                if (!r.ok) {
                    const d = await r.json();
                    throw new Error(d.erro || 'Erro desconhecido');
                }
            } catch (err) {
                setConexao('offline');
                alert(`Erro ao salvar status: ${err.message}`);
                buscarDados(); // reverte
            }
        };

        // ── Callback após salvar dados financeiros
        const aoSalvarFinanceiro = (id, novoValor, novoPago) => {
            // Atualiza localmente para refletir imediatamente na tabela
            setAgendamentos(p => p.map(a =>
                a.id === id ? { ...a, valor: novoValor, pago: novoPago ? 1 : 0 } : a
            ));
            // Recarrega resumo financeiro se a tela estiver aberta
            if (telaAtiva === 'financeiro') buscarFinanceiro(mesFin);
        };

        const abrirProntuario = tel => {
            const p = pacientesUnicos.find(x => x.telefone === tel);
            setPacienteSel(p || null);
            setTelaAtiva('prontuarios');
        };

        // ── Calendário
        const diasNoMes      = new Date(mesAtual.getFullYear(), mesAtual.getMonth()+1, 0).getDate();
        const primeiroDiaMes = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1).getDay();
        const mudarMes       = d => setMesAtual(new Date(mesAtual.getFullYear(), mesAtual.getMonth()+d, 1));
        const diaParaIso     = d => {
            const a = mesAtual.getFullYear(), m = String(mesAtual.getMonth()+1).padStart(2,'0');
            return `${a}-${m}-${String(d).padStart(2,'0')}`;
        };
        const agsDoDia = agendamentos.filter(a => isoParaDia(a.data) === dataSel);
        const temAgs   = d => agendamentos.some(a => isoParaDia(a.data) === diaParaIso(d));

        // ── Pacientes persistidos no banco, enriquecidos com o histórico de agenda
        const mapaPacientes = clientes.reduce((acc, cliente) => {
            acc[cliente.telefone] = {
                ...cliente,
                totalConsultas: Number(cliente.totalConsultas || 0),
                ultimaConsulta: cliente.ultimaConsulta || null,
                historico: [],
            };
            return acc;
        }, {});
        agendamentos.forEach(cur => {
            const k = cur.telefone;
            if (!mapaPacientes[k]) mapaPacientes[k] = { nome:cur.nome, telefone:k, email:null, totalConsultas:0, ultimaConsulta:null, historico:[] };
            mapaPacientes[k].historico.push(cur);
            mapaPacientes[k].totalConsultas = mapaPacientes[k].historico.length;
            if (!mapaPacientes[k].ultimaConsulta || new Date(cur.data) > new Date(mapaPacientes[k].ultimaConsulta)) mapaPacientes[k].ultimaConsulta = cur.data;
        });
        const pacientesUnicos = Object.values(mapaPacientes)
            .sort((a,b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));

        const pacientesFiltrados = pacientesUnicos.filter(p =>
            p.nome.toLowerCase().includes(termoBusca.toLowerCase()) || p.telefone.includes(termoBusca)
        );

        // ── Agendamentos do mês selecionado no financeiro
        const agsMesFin = agendamentos
            .filter(a => isoParaDia(a.data).startsWith(mesFin))
            .sort((a,b) => new Date(b.data) - new Date(a.data));

        const agendamentosHoje = agendamentos.filter(a => isoParaDia(a.data) === hojeStr());
        const proximosAgendamentos = agendamentos.filter(a => isoParaDia(a.data) >= hojeStr() && (a.status || 'pendente') === 'pendente');
        const pagamentosPendentes = agendamentos.filter(a => a.valor != null && !a.pago);
        const agendamentosOrdenados = [...agendamentos].sort((a,b) => `${isoParaDia(b.data)} ${b.horario || ''}`.localeCompare(`${isoParaDia(a.data)} ${a.horario || ''}`));

        // ── Loading inicial
        if (estado.validando) return (
            <div className="min-h-screen flex items-center justify-center bg-slate-900">
                <div className="w-10 h-10 border-4 border-teal-500/30 border-t-teal-500 rounded-full loader"></div>
            </div>
        );

        if (!token) return <AuthScreen modo={authMode} setModo={setAuthMode} resetToken={resetToken} cadastroDisponivel={cadastroDisponivel} onAutenticado={aoAutenticar} />;

        const menu = [
            { id: 'inicio',      icon: 'fa-house',          text: 'Início' },
            { id: 'agenda',      icon: 'fa-calendar-check', text: 'Agenda' },
            { id: 'pacientes',   icon: 'fa-users',          text: 'Pacientes' },
            { id: 'prontuarios', icon: 'fa-clock-rotate-left', text: 'Histórico' },
            { id: 'financeiro',  icon: 'fa-wallet',         text: 'Financeiro' },
            ...(usuario?.papel === 'admin' ? [{ id:'equipe', icon:'fa-user-shield', text:'Equipe' }] : []),
        ];

        return (
            <div className="flex h-full w-full bg-slate-50">
                {/* Modal de pagamento */}
                {modalFin && (
                    <ModalFinanceiro
                        item={modalFin}
                        onSalvar={aoSalvarFinanceiro}
                        onFechar={() => setModalFin(null)}
                    />
                )}

                {sidebarOpen && (
                    <button aria-label="Fechar menu" onClick={() => setSidebarOpen(false)}
                        className="fixed inset-0 bg-slate-950/40 z-20 md:hidden"></button>
                )}

                {/* ── SIDEBAR ─────────────────────────────────────────── */}
                <aside className={`fixed md:static inset-y-0 left-0 w-64 md:w-60 bg-white border-r border-slate-200 flex flex-col justify-between h-full flex-shrink-0 shadow-xl md:shadow-sm z-30 transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                    <div>
                        <div className="p-5 flex items-center gap-3 border-b border-slate-100 mb-3">
                            <div className="bg-teal-500 text-white p-2 rounded-xl shadow-inner">
                                <i className="fa-solid fa-tooth text-lg"></i>
                            </div>
                            <div>
                                <h1 className="text-sm font-extrabold text-slate-900 leading-tight">{usuario?.nome?.split(' ')[0] || 'Clínica'}</h1>
                                <p className="text-[10px] text-teal-600 font-mono tracking-widest">{usuario?.papel === 'admin' ? 'ADMINISTRAÇÃO' : 'PAINEL'}</p>
                            </div>
                        </div>
                        <nav className="px-3 space-y-1">
                            {menu.map(item => (
                                <button key={item.id} onClick={() => { setTelaAtiva(item.id); setSidebarOpen(false); }}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all text-sm ${
                                        telaAtiva === item.id
                                            ? 'bg-teal-50 text-teal-700 font-bold border border-teal-100'
                                            : 'text-slate-500 hover:bg-slate-50 hover:text-teal-600 font-medium'
                                    }`}>
                                    <i className={`fa-solid ${item.icon} w-4 text-center text-sm ${telaAtiva === item.id ? 'text-teal-600' : 'text-slate-400'}`}></i>
                                    {item.text}
                                </button>
                            ))}
                        </nav>
                    </div>
                    <div className="p-3 border-t border-slate-100">
                        <button onClick={sair}
                            className="w-full flex items-center gap-3 px-3 py-2.5 text-red-500 hover:bg-red-50 rounded-xl font-semibold text-sm transition border border-transparent hover:border-red-100">
                            <i className="fa-solid fa-power-off w-4 text-center"></i> Sair
                        </button>
                    </div>
                </aside>

                {/* ── CONTEÚDO PRINCIPAL ──────────────────────────────── */}
                <main className="flex-1 flex flex-col h-full overflow-hidden">
                    <header className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-7 flex-shrink-0 shadow-sm">
                        <div className="flex items-center gap-3">
                            <button aria-label="Abrir menu" onClick={() => setSidebarOpen(true)} className="md:hidden w-9 h-9 rounded-xl border border-slate-200 text-slate-600">
                                <i className="fa-solid fa-bars"></i>
                            </button>
                            <span className="text-sm text-slate-500 font-medium">
                                Olá, <span className="font-bold text-slate-800">{usuario?.nome?.split(' ')[0]}</span> 👋
                            </span>
                        </div>
                        <div className={`flex items-center gap-2 text-[11px] md:text-xs font-mono px-3 py-1.5 rounded-full border ${conexao === 'online' ? 'text-green-700 bg-green-50 border-green-100' : conexao === 'offline' ? 'text-red-700 bg-red-50 border-red-100' : 'text-slate-500 bg-slate-50 border-slate-200'}`}>
                            <span className={`w-2 h-2 rounded-full ${conexao === 'online' ? 'bg-green-500' : conexao === 'offline' ? 'bg-red-500' : 'bg-amber-400 animate-pulse'}`}></span>
                            {conexao === 'online' ? 'Sincronizado' : conexao === 'offline' ? 'Sem conexão' : 'Conectando'}
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 md:p-7">

                        {/* ════ INÍCIO ════ */}
                        {telaAtiva === 'inicio' && (
                            <>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                    {[
                                        { icon:'fa-calendar-day', label:'Consultas hoje', valor:agendamentosHoje.length, detalhe:'Ver agenda do dia', tela:'agenda' },
                                        { icon:'fa-hourglass-half', label:'A confirmar', valor:proximosAgendamentos.length, detalhe:'Próximos horários', tela:'inicio' },
                                        { icon:'fa-users', label:'Pacientes', valor:pacientesUnicos.length, detalhe:'Contatos únicos', tela:'pacientes' },
                                        { icon:'fa-hand-holding-dollar', label:'Pagamentos pendentes', valor:pagamentosPendentes.length, detalhe:'Revisar financeiro', tela:'financeiro' },
                                    ].map((c, i) => (
                                        <div key={i} onClick={() => setTelaAtiva(c.tela)}
                                            className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md hover:border-teal-100 transition cursor-pointer flex flex-col gap-2 group">
                                            <div className="flex items-start justify-between gap-3">
                                                <div className="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-teal-600 text-lg group-hover:bg-teal-50 transition">
                                                    <i className={`fa-solid ${c.icon}`}></i>
                                                </div>
                                                <strong className="text-2xl font-extrabold text-slate-900">{c.valor}</strong>
                                            </div>
                                            <p className="font-bold text-slate-700 text-sm">{c.label}</p>
                                            <p className="text-[11px] text-slate-400">{c.detalhe}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-7 py-5 border-b border-slate-100 flex items-center justify-between">
                                        <h2 className="text-lg font-extrabold text-slate-900">Todos os Agendamentos</h2>
                                        <button onClick={buscarDados}
                                            className="w-9 h-9 bg-white border border-slate-200 rounded-xl text-slate-400 hover:text-teal-600 shadow-sm flex items-center justify-center" title="Atualizar">
                                            <i className="fa-solid fa-rotate-right text-sm"></i>
                                        </button>
                                    </div>
                                    <div className="md:hidden divide-y divide-slate-100">
                                        {agendamentosOrdenados.length === 0 && <p className="p-7 text-center text-slate-400 text-sm">Nenhum agendamento registrado.</p>}
                                        {agendamentosOrdenados.map(item => (
                                            <article key={item.id} className="p-5">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div>
                                                        <h3 className="font-extrabold text-slate-900 text-sm">{item.nome}</h3>
                                                        <p className="text-xs text-slate-400 mt-1">{formatarData(item.data)} · {formatarHorario(item.horario)}</p>
                                                        <p className="text-xs text-slate-500 mt-1 capitalize">{item.preferencia || 'Avaliação geral'}</p>
                                                    </div>
                                                    <select aria-label={`Status de ${item.nome}`} value={item.status || 'pendente'} onChange={e => atualizarStatus(item.id, e.target.value)} className="bg-white border border-slate-200 text-slate-600 text-[11px] rounded-lg px-2 py-1 outline-none">
                                                        <option value="pendente">Aguardando</option>
                                                        <option value="confirmada">Compareceu</option>
                                                        <option value="faltou">Faltou</option>
                                                    </select>
                                                </div>
                                                <div className="flex items-center gap-2 mt-4">
                                                    <a aria-label={`WhatsApp de ${item.nome}`} href={`https://wa.me/55${item.telefone.replace(/\D/g,'')}`} target="_blank" rel="noopener noreferrer" className="w-9 h-9 bg-green-50 text-green-600 rounded-xl flex items-center justify-center"><i className="fa-brands fa-whatsapp"></i></a>
                                                    <button onClick={() => abrirProntuario(item.telefone)} className="flex-1 bg-slate-900 text-white h-9 rounded-xl text-xs font-bold">Ver histórico</button>
                                                    <button aria-label={`Apagar agendamento de ${item.nome}`} onClick={() => apagar(item.id)} className="w-9 h-9 border border-red-200 text-red-500 rounded-xl"><i className="fa-solid fa-trash"></i></button>
                                                </div>
                                            </article>
                                        ))}
                                    </div>
                                    <div className="hidden md:block overflow-x-auto">
                                        <table className="w-full text-left text-sm min-w-[820px]">
                                            <thead>
                                                <tr className="bg-slate-50/60 text-slate-400 text-xs uppercase tracking-widest border-b border-slate-100">
                                                    <th className="px-7 py-4 font-bold">Paciente</th>
                                                    <th className="px-7 py-4 font-bold">Data / Horário</th>
                                                    <th className="px-7 py-4 font-bold">Motivo</th>
                                                    <th className="px-7 py-4 font-bold">Status</th>
                                                    <th className="px-7 py-4 font-bold">Valor</th>
                                                    <th className="px-7 py-4 font-bold text-right">Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50 font-medium text-slate-700">
                                                {agendamentos.length === 0 && (
                                                    <tr><td colSpan="6" className="px-7 py-10 text-center text-slate-400">Nenhum agendamento registrado.</td></tr>
                                                )}
                                                {agendamentosOrdenados.map(item => (
                                                    <tr key={item.id} className="hover:bg-slate-50/60 transition-colors">
                                                        <td className="px-7 py-4">
                                                            <div className="font-bold text-slate-900 text-sm">{item.nome}</div>
                                                            <div className="text-xs text-slate-400">{item.telefone}</div>
                                                        </td>
                                                        <td className="px-7 py-4 text-sm">
                                                            <div><i className="fa-regular fa-calendar text-teal-400 mr-1 text-xs"></i>{formatarData(item.data)}</div>
                                                            <div className="text-xs text-slate-400 mt-0.5">{formatarHorario(item.horario)}</div>
                                                        </td>
                                                        <td className="px-7 py-4 text-xs text-slate-500 capitalize">{item.preferencia || '—'}</td>
                                                        <td className="px-7 py-4">
                                                            <select value={item.status || 'pendente'}
                                                                onChange={e => atualizarStatus(item.id, e.target.value)}
                                                                className="bg-white border border-slate-200 text-slate-600 text-xs rounded-lg px-2 py-1 outline-none">
                                                                <option value="pendente">⏳ Aguardando</option>
                                                                <option value="confirmada">✅ Compareceu</option>
                                                                <option value="faltou">❌ Faltou</option>
                                                            </select>
                                                        </td>
                                                        <td className="px-7 py-4">
                                                            {item.valor != null
                                                                ? <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${item.pago ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                                    {item.pago ? '✅' : '⏳'} {formatarReais(item.valor)}
                                                                  </span>
                                                                : <span className="text-slate-300 text-xs">—</span>
                                                            }
                                                        </td>
                                                        <td className="px-7 py-4 text-right">
                                                            <div className="flex items-center justify-end gap-2">
                                                                <button onClick={() => abrirProntuario(item.telefone)}
                                                                    className="bg-slate-900 text-white hover:bg-teal-600 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm transition">
                                                                    <i className="fa-solid fa-notes-medical"></i> Ficha
                                                                </button>
                                                                <button onClick={() => apagar(item.id)}
                                                                    className="border border-red-200 text-red-400 hover:bg-red-50 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                    <i className="fa-solid fa-trash"></i>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </>
                        )}

                        {/* ════ AGENDA ════ */}
                        {telaAtiva === 'agenda' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-7">
                                <div className="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-100 p-7">
                                    <div className="flex items-center justify-between mb-6">
                                        <h2 className="text-xl font-extrabold text-slate-900 capitalize">
                                            {mesAtual.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}
                                        </h2>
                                        <div className="flex gap-2">
                                            <button onClick={() => mudarMes(-1)} className="w-9 h-9 border border-slate-200 rounded-xl text-slate-500 hover:text-teal-600 text-sm"><i className="fa-solid fa-chevron-left"></i></button>
                                            <button onClick={() => {
                                                const h = new Date();
                                                setMesAtual(new Date(h.getFullYear(), h.getMonth(), 1));
                                                setDataSel(hojeStr());
                                            }} className="px-3 h-9 border border-slate-200 rounded-xl font-bold text-xs text-slate-500 hover:text-teal-600">Hoje</button>
                                            <button onClick={() => mudarMes(1)} className="w-9 h-9 border border-slate-200 rounded-xl text-slate-500 hover:text-teal-600 text-sm"><i className="fa-solid fa-chevron-right"></i></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 mb-1">
                                        {['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => (
                                            <div key={d} className="text-center font-bold text-slate-400 text-[10px] uppercase py-2">{d}</div>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-7 gap-1">
                                        {Array.from({ length: primeiroDiaMes }).map((_,i) => (
                                            <div key={`e${i}`} className="h-16 rounded-xl border border-dashed border-slate-100 bg-slate-50/30"></div>
                                        ))}
                                        {Array.from({ length: diasNoMes }).map((_,i) => {
                                            const dia = i+1, iso = diaParaIso(dia), isSel = dataSel === iso;
                                            return (
                                                <div key={dia} onClick={() => setDataSel(iso)}
                                                    className={`h-16 rounded-xl border p-1.5 cursor-pointer flex flex-col justify-between ${isSel ? 'border-teal-500 bg-teal-50' : 'border-slate-100 hover:border-teal-200 bg-white'}`}>
                                                    <span className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isSel ? 'text-teal-700' : 'text-slate-600'}`}>{dia}</span>
                                                    {temAgs(dia) && <span className="w-2 h-2 bg-teal-500 rounded-full self-end"></span>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-slate-900 rounded-3xl shadow-lg p-7 flex flex-col">
                                    <h3 className="text-lg font-extrabold text-white mb-1">Consultas do Dia</h3>
                                    <p className="text-teal-400 font-mono text-xs mb-6">{formatarData(dataSel)}</p>
                                    <div className="flex-1 overflow-y-auto space-y-3">
                                        {agsDoDia.length === 0 && (
                                            <p className="text-slate-500 text-sm text-center py-8">Nenhuma consulta neste dia.</p>
                                        )}
                                        {agsDoDia.map(ag => (
                                            <div key={ag.id} className="bg-slate-800 p-4 rounded-2xl border border-slate-700 relative overflow-hidden">
                                                <div className={`absolute top-0 left-0 w-1 h-full ${ag.horario && !ag.horario.includes(':') && ag.horario === 'manha' ? 'bg-amber-400' : ag.horario && !ag.horario.includes(':') ? 'bg-indigo-400' : parseInt(ag.horario) < 12 ? 'bg-amber-400' : 'bg-indigo-400'}`}></div>
                                                <h4 className="font-bold text-white text-sm ml-3">{ag.nome}</h4>
                                                <p className="text-slate-400 text-xs ml-3 mt-0.5">
                                                    <i className="fa-brands fa-whatsapp text-green-400 mr-1"></i>{ag.telefone}
                                                </p>
                                                <p className="text-slate-500 text-xs ml-3 mt-0.5 capitalize">{ag.preferencia || 'Avaliação Geral'}</p>
                                                <p className="text-teal-500 text-xs ml-3 font-mono">{formatarHorario(ag.horario)}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ════ PACIENTES ════ */}
                        {telaAtiva === 'pacientes' && (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-7 flex flex-col">
                                <div className="flex justify-between items-center mb-6 gap-4 flex-wrap">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900">Lista de Pacientes</h2>
                                        <p className="text-slate-500 text-sm">{pacientesFiltrados.length} paciente(s)</p>
                                    </div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <input type="text" placeholder="Buscar por nome ou telefone..."
                                            value={termoBusca} onChange={e => setTermoBusca(e.target.value)}
                                            className="w-full sm:w-72 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-teal-500 text-sm" />
                                        <button onClick={() => setClienteEstado(p => ({ ...p, aberto:!p.aberto, erro:null }))} className="h-10 px-4 bg-teal-600 text-white rounded-xl text-xs font-bold hover:bg-teal-700">
                                            <i className="fa-solid fa-user-plus mr-1.5"></i>Novo paciente
                                        </button>
                                    </div>
                                </div>
                                {clienteEstado.aberto && (
                                    <form onSubmit={criarCliente} className="grid sm:grid-cols-4 gap-3 bg-teal-50 border border-teal-100 p-4 rounded-2xl mb-5">
                                        <input required placeholder="Nome completo" value={novoCliente.nome} onChange={e => setNovoCliente(p => ({...p,nome:e.target.value}))} className="h-11 px-3 rounded-xl border border-teal-200 bg-white text-sm outline-none focus:border-teal-500" />
                                        <input required placeholder="Telefone com DDD" value={novoCliente.telefone} onChange={e => setNovoCliente(p => ({...p,telefone:e.target.value}))} className="h-11 px-3 rounded-xl border border-teal-200 bg-white text-sm outline-none focus:border-teal-500" />
                                        <input type="email" placeholder="E-mail (opcional)" value={novoCliente.email} onChange={e => setNovoCliente(p => ({...p,email:e.target.value}))} className="h-11 px-3 rounded-xl border border-teal-200 bg-white text-sm outline-none focus:border-teal-500" />
                                        <button disabled={clienteEstado.loading} className="h-11 bg-slate-900 text-white rounded-xl text-xs font-bold disabled:opacity-60">{clienteEstado.loading ? 'Salvando...' : 'Cadastrar'}</button>
                                        {clienteEstado.erro && <p role="alert" className="sm:col-span-4 text-xs text-red-700 font-semibold">{clienteEstado.erro}</p>}
                                    </form>
                                )}
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead>
                                            <tr className="bg-slate-50/50 text-slate-400 text-xs uppercase border-b border-slate-100">
                                                <th className="px-5 py-3 font-bold">Paciente</th>
                                                <th className="px-5 py-3 font-bold text-center">Consultas</th>
                                                <th className="px-5 py-3 font-bold">Última visita</th>
                                                <th className="px-5 py-3 font-bold text-right">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50 font-medium text-slate-700">
                                            {pacientesFiltrados.length === 0 && (
                                                <tr><td colSpan="4" className="px-5 py-10 text-center text-slate-400">Nenhum paciente encontrado.</td></tr>
                                            )}
                                            {pacientesFiltrados.map((p, i) => (
                                                <tr key={i} className="hover:bg-slate-50/60">
                                                    <td className="px-5 py-4">
                                                        <div className="font-bold text-slate-900">{p.nome}</div>
                                                        <div className="text-slate-400 text-xs">{p.telefone}</div>
                                                    </td>
                                                    <td className="px-5 py-4 text-center">
                                                        <span className="bg-slate-100 px-3 py-0.5 rounded-full font-bold text-xs">{p.totalConsultas}</span>
                                                    </td>
                                                    <td className="px-5 py-4 text-sm">
                                                        <i className="fa-regular fa-calendar-check text-slate-300 mr-1"></i>
                                                        {formatarData(p.ultimaConsulta)}
                                                    </td>
                                                    <td className="px-5 py-4 text-right">
                                                        <button onClick={() => abrirProntuario(p.telefone)}
                                                            className="border border-slate-200 text-slate-600 hover:text-teal-600 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ml-auto transition">
                                                            <i className="fa-solid fa-clock-rotate-left"></i> Histórico
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ════ HISTÓRICO DE AGENDAMENTOS ════ */}
                        {telaAtiva === 'prontuarios' && (
                            <div className="flex flex-col lg:flex-row min-h-full gap-5">
                                <div className="w-full lg:w-72 flex-shrink-0 bg-white rounded-3xl shadow-sm border border-slate-100 p-5 flex flex-col max-h-72 lg:max-h-none">
                                    <h3 className="text-base font-extrabold text-slate-900 mb-3">Pacientes</h3>
                                    <input type="text" placeholder="Buscar..." value={termoBusca}
                                        onChange={e => setTermoBusca(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-sm outline-none focus:border-teal-500" />
                                    <div className="flex-1 overflow-y-auto space-y-1">
                                        {pacientesFiltrados.map((p, i) => (
                                            <div key={i} onClick={() => setPacienteSel(p)}
                                                className={`p-3 rounded-xl cursor-pointer transition border ${pacienteSel?.telefone === p.telefone ? 'bg-teal-50 border-teal-200' : 'border-transparent hover:bg-slate-50'}`}>
                                                <p className={`font-bold text-sm ${pacienteSel?.telefone === p.telefone ? 'text-teal-800' : 'text-slate-700'}`}>{p.nome}</p>
                                                <p className="text-xs text-slate-400 mt-0.5">{p.telefone}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex-1 bg-white rounded-3xl shadow-sm border border-slate-100 p-7 overflow-y-auto">
                                    {!pacienteSel ? (
                                        <div className="flex flex-col items-center justify-center h-full text-slate-400">
                                            <i className="fa-solid fa-file-medical text-5xl mb-3 text-slate-200"></i>
                                            <p className="font-medium">Selecione um paciente à esquerda.</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="flex justify-between items-start border-b border-slate-100 pb-5 mb-5">
                                                <div>
                                                    <h2 className="text-2xl font-extrabold text-slate-900">{pacienteSel.nome}</h2>
                                                    <div className="flex items-center gap-3 mt-2 flex-wrap">
                                                        <span className="text-slate-500 font-mono text-xs bg-slate-50 px-3 py-1 rounded-full">
                                                            <i className="fa-brands fa-whatsapp text-green-500 mr-1"></i>{pacienteSel.telefone}
                                                        </span>
                                                        <span className="text-slate-500 text-xs bg-slate-50 px-3 py-1 rounded-full">
                                                            <i className="fa-solid fa-tooth text-teal-500 mr-1"></i>{pacienteSel.totalConsultas} consulta(s)
                                                        </span>
                                                    </div>
                                                </div>
                                                <a href={`https://wa.me/55${pacienteSel.telefone.replace(/\D/g,'')}`}
                                                   target="_blank" rel="noopener noreferrer"
                                                   className="bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 hover:bg-green-600 transition flex-shrink-0">
                                                    <i className="fa-brands fa-whatsapp"></i> Contatar
                                                </a>
                                            </div>
                                            <h3 className="font-bold text-slate-600 mb-3 uppercase tracking-wider text-xs flex items-center gap-2">
                                                <i className="fa-solid fa-clock-rotate-left text-teal-400"></i> Histórico de agendamentos
                                            </h3>
                                            <div className="space-y-3">
                                                {[...pacienteSel.historico]
                                                    .sort((a,b) => new Date(b.data)-new Date(a.data))
                                                    .map((c,i) => (
                                                        <div key={i} className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                            <div className="flex justify-between items-start gap-2 flex-wrap">
                                                                <p className="font-bold text-slate-900 text-sm">
                                                                    <i className="fa-regular fa-calendar-check text-teal-400 mr-1"></i>
                                                                    {formatarData(c.data)}
                                                                    <span className="text-slate-400 font-normal text-xs ml-2">({formatarHorario(c.horario)})</span>
                                                                </p>
                                                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${c.status === 'confirmada' ? 'bg-green-100 text-green-700' : c.status === 'faltou' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-700'}`}>
                                                                    {c.status === 'confirmada' ? '✅ Compareceu' : c.status === 'faltou' ? '❌ Faltou' : '⏳ Aguardando'}
                                                                </span>
                                                            </div>
                                                            <p className="text-slate-500 text-xs mt-1 capitalize">Motivo: {c.preferencia || 'Avaliação geral'}</p>
                                                            {c.observacoes && (
                                                                <p className="text-slate-600 text-xs mt-2 bg-white p-2.5 rounded-xl border border-slate-100">
                                                                    {c.observacoes}
                                                                </p>
                                                            )}
                                                            {c.valor != null && (
                                                                <p className="text-xs mt-2 font-semibold flex items-center gap-2">
                                                                    <span className="font-mono">{formatarReais(c.valor)}</span>
                                                                    <span className={`px-2 py-0.5 rounded-full ${c.pago ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                                        {c.pago ? 'Pago' : 'Pendente'}
                                                                    </span>
                                                                </p>
                                                            )}
                                                        </div>
                                                    ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ════ EQUIPE ════ */}
                        {telaAtiva === 'equipe' && usuario?.papel === 'admin' && (
                            <div className="grid lg:grid-cols-[360px_1fr] gap-6 items-start">
                                <form onSubmit={criarUsuario} className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 space-y-4">
                                    <div>
                                        <p className="text-xs text-teal-600 font-bold uppercase tracking-widest">Acesso seguro</p>
                                        <h2 className="text-xl font-extrabold text-slate-900 mt-1">Adicionar à equipe</h2>
                                        <p className="text-xs text-slate-500 mt-1">Cada pessoa recebe seu próprio login.</p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">Nome completo</label>
                                        <input required value={novoUsuario.nome} onChange={e => setNovoUsuario(p => ({...p,nome:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">E-mail</label>
                                        <input required type="email" value={novoUsuario.email} onChange={e => setNovoUsuario(p => ({...p,email:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">Senha temporária</label>
                                        <input required type="password" minLength="8" value={novoUsuario.senha} onChange={e => setNovoUsuario(p => ({...p,senha:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm" />
                                        <p className="text-[10px] text-slate-400 mt-1">Pelo menos 8 caracteres, letra e número.</p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">Perfil</label>
                                        <select value={novoUsuario.papel} onChange={e => setNovoUsuario(p => ({...p,papel:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm">
                                            <option value="dentista">Dentista</option>
                                            <option value="recepcao">Recepção</option>
                                            <option value="admin">Administrador</option>
                                        </select>
                                    </div>
                                    {equipeEstado.erro && <p role="alert" className="text-xs text-red-700 bg-red-50 p-3 rounded-xl">{equipeEstado.erro}</p>}
                                    {equipeEstado.sucesso && <p className="text-xs text-green-700 bg-green-50 p-3 rounded-xl">{equipeEstado.sucesso}</p>}
                                    <button disabled={equipeEstado.loading} className="w-full h-11 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-teal-700 disabled:opacity-60">{equipeEstado.loading ? 'Criando...' : 'Criar acesso'}</button>
                                </form>

                                <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                                    <div className="p-6 border-b border-slate-100">
                                        <h2 className="text-lg font-extrabold text-slate-900">Contas da clínica</h2>
                                        <p className="text-xs text-slate-500 mt-1">{usuarios.length} usuário(s) cadastrado(s)</p>
                                    </div>
                                    <div className="divide-y divide-slate-100">
                                        {usuarios.map(u => (
                                            <div key={u.id} className="p-5 flex items-center justify-between gap-4 flex-wrap">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${u.ativo ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'}`}><i className="fa-solid fa-user"></i></div>
                                                    <div className="min-w-0">
                                                        <p className="font-bold text-slate-900 text-sm truncate">{u.nome}{u.id === usuario.id && <span className="text-teal-600 text-[10px] ml-2">VOCÊ</span>}</p>
                                                        <p className="text-xs text-slate-400 truncate">{u.email}</p>
                                                        <p className="text-[10px] text-slate-400 uppercase mt-0.5">{u.papel === 'admin' ? 'Administrador' : u.papel === 'recepcao' ? 'Recepção' : 'Dentista'}</p>
                                                    </div>
                                                </div>
                                                <button disabled={u.id === usuario.id} onClick={() => alterarUsuario(u.id, !u.ativo)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border disabled:opacity-40 ${u.ativo ? 'border-red-200 text-red-600 hover:bg-red-50' : 'border-green-200 text-green-700 hover:bg-green-50'}`}>
                                                    {u.ativo ? 'Desativar' : 'Ativar'}
                                                </button>
                                            </div>
                                        ))}
                                        {usuarios.length === 0 && <p className="p-8 text-center text-sm text-slate-400">Carregando usuários...</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ════ FINANCEIRO ════ */}
                        {telaAtiva === 'financeiro' && (
                            <div className="flex flex-col gap-6">
                                {/* Seletor de mês */}
                                <div className="flex items-center gap-3">
                                    <label className="text-sm font-semibold text-slate-600">Período:</label>
                                    <input type="month" value={mesFin} onChange={e => setMesFin(e.target.value)}
                                        className="border border-slate-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-teal-500 bg-white" />
                                    <button onClick={() => buscarFinanceiro(mesFin)}
                                        className="w-9 h-9 bg-white border border-slate-200 rounded-xl text-slate-400 hover:text-teal-600 flex items-center justify-center text-sm" title="Atualizar">
                                        <i className="fa-solid fa-rotate-right"></i>
                                    </button>
                                </div>

                                {/* Cards de resumo */}
                                {finLoading ? (
                                    <div className="grid grid-cols-3 gap-5">
                                        {[0,1,2].map(i => <div key={i} className="bg-slate-100 rounded-3xl h-28 animate-pulse"></div>)}
                                    </div>
                                ) : resumoFin ? (
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-5">
                                        <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-lg">
