                                    <div className="flex-1 overflow-y-auto space-y-1">
                                        {pacientesFiltrados.map((p, i) => (
                                            <div key={i} onClick={() => setPacienteSel(p)}
                                                className={`p-3 rounded-xl cursor-pointer transition border ${pacienteSel?.telefone === p.telefone ? 'bg-teal-50 border-teal-200' : 'border-transparent hover:bg-slate-50'}`}>
                                                <p className={`font-bold text-sm ${pacienteSel?.telefone === p.telefone ? 'text-teal-800' : 'text-slate-700'}`}>{p.nome}</p>
                                                <p className="text-xs text-slate-400 mt-0.5">{p.telefone}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex-1 bg-white rounded-3xl shadow-sm border border-slate-100 p-7 overflow-y-auto">
                                    {!pacienteSel ? (
                                        <div className="flex flex-col items-center justify-center h-full text-slate-400">
                                            <i className="fa-solid fa-file-medical text-5xl mb-3 text-slate-200"></i>
                                            <p className="font-medium">Selecione um paciente à esquerda.</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="flex justify-between items-start border-b border-slate-100 pb-5 mb-5">
                                                <div>
                                                    <h2 className="text-2xl font-extrabold text-slate-900">{pacienteSel.nome}</h2>
                                                    <div className="flex items-center gap-3 mt-2 flex-wrap">
                                                        <span className="text-slate-500 font-mono text-xs bg-slate-50 px-3 py-1 rounded-full">
                                                            <i className="fa-brands fa-whatsapp text-green-500 mr-1"></i>{pacienteSel.telefone}
                                                        </span>
                                                        <span className="text-slate-500 text-xs bg-slate-50 px-3 py-1 rounded-full">
                                                            <i className="fa-solid fa-tooth text-teal-500 mr-1"></i>{pacienteSel.totalConsultas} consulta(s)
                                                        </span>
                                                    </div>
                                                </div>
                                                <a href={`https://wa.me/55${pacienteSel.telefone.replace(/\D/g,'')}`}
                                                   target="_blank" rel="noopener noreferrer"
                                                   className="bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 hover:bg-green-600 transition flex-shrink-0">
                                                    <i className="fa-brands fa-whatsapp"></i> Contatar
                                                </a>
                                            </div>
                                            <h3 className="font-bold text-slate-600 mb-3 uppercase tracking-wider text-xs flex items-center gap-2">
                                                <i className="fa-solid fa-clock-rotate-left text-teal-400"></i> Histórico de agendamentos
                                            </h3>
                                            <div className="space-y-3">
                                                {[...pacienteSel.historico]
                                                    .sort((a,b) => new Date(b.data)-new Date(a.data))
                                                    .map((c,i) => (
                                                        <div key={i} className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                            <div className="flex justify-between items-start gap-2 flex-wrap">
                                                                <p className="font-bold text-slate-900 text-sm">
                                                                    <i className="fa-regular fa-calendar-check text-teal-400 mr-1"></i>
                                                                    {formatarData(c.data)}
                                                                    <span className="text-slate-400 font-normal text-xs ml-2">({formatarHorario(c.horario)})</span>
                                                                </p>
                                                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0 ${statusInfo(c.status).classe}`}>
                                                                    {statusInfo(c.status).curto}
                                                                </span>
                                                            </div>
                                                            <p className="text-slate-500 text-xs mt-1 capitalize">Motivo: {c.preferencia || 'Avaliação geral'}</p>
                                                            {c.observacoes && (
                                                                <p className="text-slate-600 text-xs mt-2 bg-white p-2.5 rounded-xl border border-slate-100">
                                                                    {c.observacoes}
                                                                </p>
                                                            )}
                                                            {c.valor != null && (
                                                                <p className="text-xs mt-2 font-semibold flex items-center gap-2">
                                                                    <span className="font-mono">{formatarReais(c.valor)}</span>
                                                                    <span className={`px-2 py-0.5 rounded-full ${c.pago ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                                        {c.pago ? 'Pago' : 'Pendente'}
                                                                    </span>
                                                                </p>
                                                            )}
                                                        </div>
                                                    ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ════ EQUIPE ════ */}
                        {telaAtiva === 'equipe' && usuario?.papel === 'admin' && (
                            <div className="grid lg:grid-cols-[360px_1fr] gap-6 items-start">
                                <form onSubmit={criarUsuario} className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 space-y-4">
                                    <div>
                                        <p className="text-xs text-teal-600 font-bold uppercase tracking-widest">Acesso seguro</p>
                                        <h2 className="text-xl font-extrabold text-slate-900 mt-1">Adicionar à equipe</h2>
                                        <p className="text-xs text-slate-500 mt-1">A pessoa receberá um convite seguro por e-mail e criará a própria senha.</p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">Nome completo</label>
                                        <input required value={novoUsuario.nome} onChange={e => setNovoUsuario(p => ({...p,nome:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">E-mail</label>
                                        <input required type="email" value={novoUsuario.email} onChange={e => setNovoUsuario(p => ({...p,email:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">Perfil</label>
                                        <select value={novoUsuario.papel} onChange={e => setNovoUsuario(p => ({...p,papel:e.target.value}))} className="w-full h-11 px-3 border border-slate-200 rounded-xl bg-slate-50 outline-none focus:border-teal-500 text-sm">
                                            <option value="dentista">Dentista</option>
                                            <option value="recepcao">Recepção</option>
                                            <option value="admin">Administrador</option>
                                        </select>
                                    </div>
                                    {equipeEstado.erro && <p role="alert" className="text-xs text-red-700 bg-red-50 p-3 rounded-xl">{equipeEstado.erro}</p>}
                                    {equipeEstado.sucesso && <p className="text-xs text-green-700 bg-green-50 p-3 rounded-xl">{equipeEstado.sucesso}</p>}
                                    <button disabled={equipeEstado.loading} className="w-full h-12 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-teal-700 disabled:opacity-60"><i className="fa-solid fa-paper-plane mr-2"></i>{equipeEstado.loading ? 'Enviando convite...' : 'Enviar convite por e-mail'}</button>
                                </form>

                                <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                                    <div className="p-6 border-b border-slate-100">
                                        <h2 className="text-lg font-extrabold text-slate-900">Contas da clínica</h2>
                                        <p className="text-xs text-slate-500 mt-1">{usuarios.length} usuário(s) cadastrado(s)</p>
                                    </div>
                                    <div className="divide-y divide-slate-100">
                                        {usuarios.map(u => (
                                            <div key={u.id} className="p-5 flex items-center justify-between gap-4 flex-wrap">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${u.ativo ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'}`}><i className="fa-solid fa-user"></i></div>
                                                    <div className="min-w-0">
                                                        <p className="font-bold text-slate-900 text-sm truncate">{u.nome}{u.id === usuario.id && <span className="text-teal-600 text-[10px] ml-2">VOCÊ</span>}</p>
                                                        <p className="text-xs text-slate-400 truncate">{u.email}</p>
                                                        <p className="text-[10px] text-slate-400 uppercase mt-0.5">{u.papel === 'admin' ? 'Administrador' : u.papel === 'recepcao' ? 'Recepção' : 'Dentista'}</p>
                                                    </div>
                                                </div>
                                                <button disabled={u.id === usuario.id} onClick={() => alterarUsuario(u.id, !u.ativo)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border disabled:opacity-40 ${u.ativo ? 'border-red-200 text-red-600 hover:bg-red-50' : 'border-green-200 text-green-700 hover:bg-green-50'}`}>
                                                    {u.ativo ? 'Desativar' : 'Ativar'}
                                                </button>
                                            </div>
                                        ))}
                                        {usuarios.length === 0 && <p className="p-8 text-center text-sm text-slate-400">Carregando usuários...</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ════ CONFIGURAÇÃO E SEGURANÇA ════ */}
                        {telaAtiva === 'configuracao' && usuario?.papel === 'admin' && (
                            <div className="max-w-5xl space-y-6">
                                <div>
                                    <p className="text-xs uppercase tracking-widest text-teal-600 font-bold">Central de configuração</p>
                                    <h2 className="text-2xl font-extrabold text-slate-900 mt-1">Tudo pronto para trabalhar?</h2>
                                    <p className="text-sm text-slate-500 mt-1">Veja o que está funcionando sem precisar entender detalhes técnicos.</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-5">
                                    <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6">
                                        <div className="flex items-start justify-between gap-3">
                                            <div><h3 className="font-extrabold text-slate-900"><i className="fa-solid fa-envelope text-teal-600 mr-2"></i>E-mails automáticos</h3><p className="text-sm text-slate-500 mt-2">Recuperação de senha, convites e avisos de consulta.</p></div>
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${sistemaStatus?.emailConfigurado ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{sistemaStatus?.emailConfigurado ? 'Conectado' : 'Não configurado'}</span>
                                        </div>
                                        {sistemaStatus?.emailConfigurado ? <button type="button" onClick={testarEmail} className="mt-5 h-11 px-4 rounded-xl bg-slate-900 text-white text-sm font-bold"><i className="fa-solid fa-paper-plane mr-2"></i>Enviar e-mail de teste</button> : <div className="mt-5 p-4 bg-amber-50 border border-amber-200 rounded-2xl text-sm text-amber-800"><strong>Ação necessária:</strong> preencha SMTP_USER, SMTP_PASS e MAIL_FROM no ambiente do servidor e reinicie.</div>}
                                    </div>
                                    <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6">
                                        <h3 className="font-extrabold text-slate-900"><i className="fa-solid fa-shield-halved text-teal-600 mr-2"></i>Acesso protegido</h3>
                                        <div className="mt-4 space-y-3 text-sm">
                                            <div className="flex justify-between gap-3"><span className="text-slate-500">Sessão individual</span><strong className="text-green-700">Ativa</strong></div>
                                            <div className="flex justify-between gap-3"><span className="text-slate-500">Banco conectado</span><strong className="text-green-700">Ativo</strong></div>
                                            <div className="flex justify-between gap-3"><span className="text-slate-500">Site em HTTPS</span><strong className={sistemaStatus?.urlSegura ? 'text-green-700' : 'text-amber-700'}>{sistemaStatus?.urlSegura ? 'Sim' : 'Somente ao publicar'}</strong></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6">
                                    <h3 className="font-extrabold text-slate-900"><i className="fa-solid fa-file-export text-teal-600 mr-2"></i>Exportar uma cópia</h3>
                                    <p className="text-sm text-slate-500 mt-1">Baixe planilhas para conferência ou backup operacional. Guarde-as em local seguro.</p>
                                    <div className="flex flex-wrap gap-3 mt-5">
                                        <a href={`${API}/exportar/agendamentos.csv`} className="h-11 px-4 rounded-xl border border-slate-200 text-slate-700 text-sm font-bold inline-flex items-center"><i className="fa-solid fa-calendar-days mr-2 text-teal-600"></i>Baixar agendamentos</a>
                                        <a href={`${API}/exportar/clientes.csv`} className="h-11 px-4 rounded-xl border border-slate-200 text-slate-700 text-sm font-bold inline-flex items-center"><i className="fa-solid fa-users mr-2 text-teal-600"></i>Baixar pacientes</a>
                                    </div>
                                </div>
                                <div className="bg-teal-50 border border-teal-100 rounded-3xl p-6">
                                    <h3 className="font-extrabold text-teal-900">Sua conta</h3>
                                    <p className="text-sm text-teal-800 mt-1"><strong>{usuario.nome}</strong><br />{usuario.email}</p>
                                    <button type="button" onClick={() => { setToken(false); setAuthMode('esqueci'); }} className="mt-4 h-11 px-4 rounded-xl bg-white border border-teal-200 text-teal-800 text-sm font-bold">Receber link para trocar minha senha</button>
                                </div>
                            </div>
                        )}

                        {/* ════ FINANCEIRO ════ */}
                        {telaAtiva === 'financeiro' && (
                            <div className="flex flex-col gap-6">
                                {/* Seletor de mês */}
                                <div className="flex items-center gap-3">
                                    <label className="text-sm font-semibold text-slate-600">Período:</label>
                                    <input type="month" value={mesFin} onChange={e => setMesFin(e.target.value)}
                                        className="border border-slate-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-teal-500 bg-white" />
                                    <button onClick={() => buscarFinanceiro(mesFin)}
                                        className="w-9 h-9 bg-white border border-slate-200 rounded-xl text-slate-400 hover:text-teal-600 flex items-center justify-center text-sm" title="Atualizar">
                                        <i className="fa-solid fa-rotate-right"></i>
                                    </button>
                                </div>

                                {/* Cards de resumo */}
                                {finLoading ? (
                                    <div className="grid grid-cols-3 gap-5">
                                        {[0,1,2].map(i => <div key={i} className="bg-slate-100 rounded-3xl h-28 animate-pulse"></div>)}
                                    </div>
                                ) : resumoFin ? (
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-5">
                                        <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-lg">
                                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Receita esperada</p>
                                            <h3 className="text-2xl font-extrabold">{formatarReais(resumoFin.receitaTotal)}</h3>
                                            <p className="text-slate-500 text-xs mt-1">{resumoFin.totalAgendamentos} agendamento(s)</p>
                                        </div>
                                        <div className="bg-green-50 border border-green-100 p-6 rounded-3xl shadow-sm">
                                            <p className="text-green-700 text-xs font-bold uppercase tracking-wider mb-2">Recebido</p>
                                            <h3 className="text-2xl font-extrabold text-green-700">{formatarReais(resumoFin.receitaRecebida)}</h3>
                                            <p className="text-green-500 text-xs mt-1">{resumoFin.totalCompareceram} compareceu/compareceram</p>
                                        </div>
                                        <div className="bg-amber-50 border border-amber-100 p-6 rounded-3xl shadow-sm">
                                            <p className="text-amber-700 text-xs font-bold uppercase tracking-wider mb-2">A receber</p>
                                            <h3 className="text-2xl font-extrabold text-amber-700">{formatarReais(resumoFin.receitaPendente)}</h3>
                                            <p className="text-amber-500 text-xs mt-1">{resumoFin.totalFaltaram} falta(s) no mês</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-amber-50 border border-amber-200 text-amber-700 p-4 rounded-2xl text-sm flex items-center gap-3">
                                        <i className="fa-solid fa-triangle-exclamation flex-shrink-0 text-lg"></i>
                                        <div>
                                            <strong>Não foi possível carregar o resumo financeiro.</strong>
                                            <p className="text-xs mt-0.5 text-amber-600">Verifique se o servidor está online e se a migration_fix.sql foi executada no banco de dados.</p>
                                        </div>
                                    </div>
                                )}

                                {/* Tabela de lançamentos */}
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-7 py-5 border-b border-slate-100 flex items-center justify-between flex-wrap gap-3">
                                        <div>
                                            <h2 className="text-base font-extrabold text-slate-900">Lançamentos do mês</h2>
                                            <p className="text-xs text-slate-400 mt-0.5">Clique em "Editar" para registrar o valor recebido</p>
                                        </div>
                                        <div className="text-xs text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                                            {agsMesFin.length} agendamento(s)
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm min-w-[700px]">
                                            <thead>
                                                <tr className="bg-slate-50/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                                    <th className="px-6 py-3 font-bold">Paciente</th>
                                                    <th className="px-6 py-3 font-bold">Data / Horário</th>
                                                    <th className="px-6 py-3 font-bold">Serviço</th>
                                                    <th className="px-6 py-3 font-bold">Atendimento</th>
                                                    <th className="px-6 py-3 font-bold text-right">Valor</th>
                                                    <th className="px-6 py-3 font-bold text-center">Situação</th>
                                                    <th className="px-6 py-3 font-bold text-right">Ação</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50 font-medium text-slate-700">
                                                {agsMesFin.length === 0 && (
                                                    <tr><td colSpan="7" className="px-6 py-10 text-center text-slate-400 text-sm">Nenhum agendamento neste mês.</td></tr>
                                                )}
                                                {agsMesFin.map(item => (
                                                    <tr key={item.id} className="hover:bg-slate-50/60 transition-colors">
                                                        <td className="px-6 py-3">
                                                            <div className="font-bold text-xs text-slate-900">{item.nome}</div>
                                                            <div className="text-xs text-slate-400">{item.telefone}</div>
                                                        </td>
                                                        <td className="px-6 py-3 text-xs">
                                                            <div>{formatarData(item.data)}</div>
                                                            <div className="text-slate-400 mt-0.5">{formatarHorario(item.horario)}</div>
                                                        </td>
                                                        <td className="px-6 py-3 text-xs text-slate-500 capitalize">{item.preferencia || '—'}</td>
                                                        <td className="px-6 py-3">
                                                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${statusInfo(item.status).classe}`}>
                                                                {statusInfo(item.status).curto}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-3 text-xs text-right font-mono">
                                                            {item.valor != null
                                                                ? <span className="font-bold">{formatarReais(item.valor)}</span>
                                                                : <span className="text-slate-300">—</span>
                                                            }
                                                        </td>
                                                        <td className="px-6 py-3 text-center">
                                                            {item.valor != null
                                                                ? <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${item.pago ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                                    {item.pago ? 'Pago' : 'Pendente'}
                                                                  </span>
                                                                : <span className="text-slate-300 text-xs">—</span>
                                                            }
                                                        </td>
                                                        <td className="px-6 py-3 text-right">
                                                            <button
                                                                onClick={() => setModalFin({
                                                                    id:          item.id,
                                                                    nome:        item.nome,
                                                                    data:        item.data,
                                                                    preferencia: item.preferencia,
                                                                    valor:       item.valor,
                                                                    pago:        !!item.pago,
                                                                })}
                                                                className="text-xs border border-slate-200 text-slate-500 hover:text-teal-600 hover:border-teal-300 px-3 py-1 rounded-lg font-bold transition">
                                                                <i className="fa-solid fa-pen-to-square mr-1"></i> Editar
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </main>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
