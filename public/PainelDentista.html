                                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Receita esperada</p>
                                            <h3 className="text-2xl font-extrabold">{formatarReais(resumoFin.receitaTotal)}</h3>
                                            <p className="text-slate-500 text-xs mt-1">{resumoFin.totalAgendamentos} agendamento(s)</p>
                                        </div>
                                        <div className="bg-green-50 border border-green-100 p-6 rounded-3xl shadow-sm">
                                            <p className="text-green-700 text-xs font-bold uppercase tracking-wider mb-2">Recebido</p>
                                            <h3 className="text-2xl font-extrabold text-green-700">{formatarReais(resumoFin.receitaRecebida)}</h3>
                                            <p className="text-green-500 text-xs mt-1">{resumoFin.totalCompareceram} compareceu/compareceram</p>
                                        </div>
                                        <div className="bg-amber-50 border border-amber-100 p-6 rounded-3xl shadow-sm">
                                            <p className="text-amber-700 text-xs font-bold uppercase tracking-wider mb-2">A receber</p>
                                            <h3 className="text-2xl font-extrabold text-amber-700">{formatarReais(resumoFin.receitaPendente)}</h3>
                                            <p className="text-amber-500 text-xs mt-1">{resumoFin.totalFaltaram} falta(s) no mês</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-amber-50 border border-amber-200 text-amber-700 p-4 rounded-2xl text-sm flex items-center gap-3">
                                        <i className="fa-solid fa-triangle-exclamation flex-shrink-0 text-lg"></i>
                                        <div>
                                            <strong>Não foi possível carregar o resumo financeiro.</strong>
                                            <p className="text-xs mt-0.5 text-amber-600">Verifique se o servidor está online e se a migration_fix.sql foi executada no banco de dados.</p>
                                        </div>
                                    </div>
                                )}

                                {/* Tabela de lançamentos */}
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-7 py-5 border-b border-slate-100 flex items-center justify-between flex-wrap gap-3">
                                        <div>
                                            <h2 className="text-base font-extrabold text-slate-900">Lançamentos do mês</h2>
                                            <p className="text-xs text-slate-400 mt-0.5">Clique em "Editar" para registrar o valor recebido</p>
                                        </div>
                                        <div className="text-xs text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                                            {agsMesFin.length} agendamento(s)
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm min-w-[700px]">
                                            <thead>
                                                <tr className="bg-slate-50/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                                    <th className="px-6 py-3 font-bold">Paciente</th>
                                                    <th className="px-6 py-3 font-bold">Data / Horário</th>
                                                    <th className="px-6 py-3 font-bold">Serviço</th>
                                                    <th className="px-6 py-3 font-bold">Atendimento</th>
                                                    <th className="px-6 py-3 font-bold text-right">Valor</th>
                                                    <th className="px-6 py-3 font-bold text-center">Situação</th>
                                                    <th className="px-6 py-3 font-bold text-right">Ação</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50 font-medium text-slate-700">
                                                {agsMesFin.length === 0 && (
                                                    <tr><td colSpan="7" className="px-6 py-10 text-center text-slate-400 text-sm">Nenhum agendamento neste mês.</td></tr>
                                                )}
                                                {agsMesFin.map(item => (
                                                    <tr key={item.id} className="hover:bg-slate-50/60 transition-colors">
                                                        <td className="px-6 py-3">
                                                            <div className="font-bold text-xs text-slate-900">{item.nome}</div>
                                                            <div className="text-xs text-slate-400">{item.telefone}</div>
                                                        </td>
                                                        <td className="px-6 py-3 text-xs">
                                                            <div>{formatarData(item.data)}</div>
                                                            <div className="text-slate-400 mt-0.5">{formatarHorario(item.horario)}</div>
                                                        </td>
                                                        <td className="px-6 py-3 text-xs text-slate-500 capitalize">{item.preferencia || '—'}</td>
                                                        <td className="px-6 py-3">
                                                            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${item.status === 'confirmada' ? 'bg-green-100 text-green-700' : item.status === 'faltou' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-700'}`}>
                                                                {item.status === 'confirmada' ? '✅ Compareceu' : item.status === 'faltou' ? '❌ Faltou' : '⏳ Aguardando'}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-3 text-xs text-right font-mono">
                                                            {item.valor != null
                                                                ? <span className="font-bold">{formatarReais(item.valor)}</span>
                                                                : <span className="text-slate-300">—</span>
                                                            }
                                                        </td>
                                                        <td className="px-6 py-3 text-center">
                                                            {item.valor != null
                                                                ? <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${item.pago ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                                    {item.pago ? 'Pago' : 'Pendente'}
                                                                  </span>
                                                                : <span className="text-slate-300 text-xs">—</span>
                                                            }
                                                        </td>
                                                        <td className="px-6 py-3 text-right">
                                                            <button
                                                                onClick={() => setModalFin({
                                                                    id:          item.id,
                                                                    nome:        item.nome,
                                                                    data:        item.data,
                                                                    preferencia: item.preferencia,
                                                                    valor:       item.valor,
                                                                    pago:        !!item.pago,
                                                                })}
                                                                className="text-xs border border-slate-200 text-slate-500 hover:text-teal-600 hover:border-teal-300 px-3 py-1 rounded-lg font-bold transition">
                                                                <i className="fa-solid fa-pen-to-square mr-1"></i> Editar
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </main>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
